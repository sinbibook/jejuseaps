<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>제주 바다풍경 펜션 - 시설안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/common.css" />
    <link rel="stylesheet" type="text/css" href="styles/sub.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="제주 바다풍경 펜션 - 시설안내" />
  <meta property="og:description" content="제주도 푸른 바다가 펼쳐지는 오션뷰 펜션으로 해수욕장 인근에 위치하고 있습니다. 제주공항 차량 30분, 애월에 위치합니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/KomXzwBlupLg.jpg" />
  <meta property="og:url" content="https://jejuseaps.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="제주 바다풍경 펜션 - 시설안내" />
  <meta name="twitter:description" content="제주도 푸른 바다가 펼쳐지는 오션뷰 펜션으로 해수욕장 인근에 위치하고 있습니다. 제주공항 차량 30분, 애월에 위치합니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/KomXzwBlupLg.jpg" />
  <meta name="naver-site-verification" content="e8e2dc014427f4fdf544c1fed51952b080f3e5b4" />
  <meta name="google-site-verification" content="3mM-TEx5JD2DfTDVoPbJo7ZquhjUtopdjViHIj3VKNU" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub3_2 sub_special">
          <div class="sub_wide_visual visual">
            <div class="visual_box">
              <div class="visual_txt">
                <!-- data-* 속성 : data-property-name-en -->
                <span data-property-name-en></span>
                <!-- data-* 속성 : data-facility-name -->
                <strong data-facility-name></strong>
                <p>Special</p>
                <div class="arw">
                  <div class="swiper-button-prev">
                    <img src="images/left_btn.png" />
                  </div>
                  <div class="swiper-button-next">
                    <img src="images/right_btn.png" />
                  </div>
                </div>
              </div>
              <div class="swiper-container">
                <!-- data-* 속성 : data-facility-hero-slides | 동적 매핑 필요 (facilities[current].images) -->
                <div class="swiper-wrapper" data-facility-hero-slides>
                  <!-- swiper-slide | 동적 매핑 필요 -->
                </div>
              </div>
              <div class="scroll_down">
                <img src="images/scroll_down.png" alt="scroll down" />
              </div>
            </div>
          </div>
          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <!-- data-* 속성 : data-facility-nav | 동적 매핑 필요 -->
              <ul data-facility-nav>
                <!-- li | 동적 매핑 필요 (현재 facility on) -->
              </ul>
            </div>
          </div>
          <div class="sub_cont">
            <div class="title_box">
              <!-- data-* 속성 : data-property-name-en -->
              <span class="logo_txt" data-property-name-en></span>
              <!-- data-* 속성 : data-facility-name -->
              <h3 data-facility-name></h3>
            </div>
            <!-- data-* 속성 : data-facility-description -->
            <p class="special_txt" data-facility-description></p>
            <!-- data-* 속성 : data-facility-bnr | 동적 매핑 필요 (facilities[current].images, 교차 레이아웃) -->
            <!-- li 내부: strong = "Special Intro" 고정, p = image.description -->
            <ul class="sub_img_bnr" data-facility-bnr>
              <!-- li | 동적 매핑 필요 -->
            </ul>
            <div class="main_special">
              <div class="title_box title_bg">
                <!-- data-* 속성 : data-property-name-en -->
                <span class="logo_txt" data-property-name-en></span>
                <h3>Special For You</h3>
                <!-- data-* 속성 : data-index-facility-tags (facility명 # 태그, index와 동일) -->
                <p data-index-facility-tags></p>
              </div>
              <div class="special_list">
                <div class="arw">
                  <div class="swiper-button-prev">
                    <img src="images/spe_le.png" alt="prev" />
                  </div>
                  <div class="swiper-button-next">
                    <img src="images/spe_ri.png" alt="next" />
                  </div>
                </div>
                <div class="swiper-container">
                  <!-- data-* 속성 : data-index-facility-slides | 동적 매핑 필요 (index와 동일) -->
                  <div class="swiper-wrapper" data-index-facility-slides>
                    <!-- swiper-slide | 동적 매핑 필요 -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/facility-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
  </body>
</html>
